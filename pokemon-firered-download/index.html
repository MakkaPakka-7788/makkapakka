<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon FireRed Launcher</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#eee;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(520px,100%);padding:28px;background:#111;border:1px solid #444;text-align:center}h1{font-size:24px}p{color:#aaa;line-height:1.5}input,button{font:inherit;margin:12px 0;padding:12px;width:100%}button{background:#eee;color:#080808;border:0;cursor:pointer;font-weight:bold}#game{width:100%;min-height:300px}small{color:#777}</style></head><body><main class="panel"><h1>Pokémon FireRed</h1><p>Select a FireRed ROM file (.gba) that you are legally allowed to use. The ZIP does not include the game ROM.</p><input id="rom" type="file" accept=".gba,application/octet-stream"><button id="play" type="button">LOAD GAME</button><div id="game"></div><small>Game emulation loads in your browser.</small></main><script>document.getElementById("play").addEventListener("click",function(){const file=document.getElementById("rom").files[0];if(!file){alert("Choose your .gba file first.");return;}window.EJS_player="#game";window.EJS_core="gba";window.EJS_color="#000000";window.EJS_startOnLoaded=true;window.EJS_pathtodata="https://cdn.jsdelivr.net/gh/bubblfan/emu@master/";window.EJS_gameUrl=URL.createObjectURL(file);const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js";document.body.appendChild(s);});</script></body></html>
