<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GBA Emulator | Flashcard.com</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#eee}
body{font-family:"Press Start 2P",cursive}
#shell{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
#startButton{display:block;width:200px;min-height:60px;background:#4caf50;color:#fff;text-align:center;font:12px "Press Start 2P",cursive;padding:16px;border:0;border-radius:8px;cursor:pointer;box-shadow:0 0 10px 2px #000}
#startButton:disabled{opacity:.65;cursor:wait}
#picker{display:none}
#game{display:none;width:100vw;height:100vh;background:#000}
#game canvas{max-width:100%;max-height:100%;object-fit:contain}
#status{position:fixed;left:10px;right:10px;bottom:10px;color:#aaa;font:10px Arial,sans-serif;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="shell">
<button id="startButton" type="button">PLAY</button>
<input id="picker" type="file" accept=".gba,.zip">
<div id="game"></div>
<div id="status"></div>
</div>
<script>
const startButton=document.getElementById("startButton");
const picker=document.getElementById("picker");
const game=document.getElementById("game");
const statusText=document.getElementById("status");
let loading=false;
let gameObjectUrl="";
startButton.addEventListener("click",()=>picker.click());
picker.addEventListener("change",()=>{
 const file=picker.files&&picker.files[0];
 if(!file)return;
 if(loading)return;
 loading=true;
 startButton.style.display="none";
 game.style.display="block";
 statusText.textContent="Loading EmulatorJS…";
 gameObjectUrl=URL.createObjectURL(file);
 window.EJS_player="#game";
 window.EJS_core="gba";
 window.EJS_gameName=file.name;
 window.EJS_color="#000000";
 window.EJS_startOnLoaded=true;
 window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
 window.EJS_gameUrl=gameObjectUrl;
 const loader=document.createElement("script");
 loader.src="https://cdn.emulatorjs.org/stable/data/loader.js";
 loader.onerror=()=>{
  statusText.textContent="EmulatorJS failed to load. Check your connection and refresh.";
  loading=false;
  game.style.display="none";
  startButton.style.display="block";
 };
 document.body.appendChild(loader);
});
</script>
</body>
</html>
