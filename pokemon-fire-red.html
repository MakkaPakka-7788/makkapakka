<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GBA Emulator | Flashcard.com</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#eee;font-family:"Courier New",monospace}
#shell{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
#picker{max-width:90%;color:#ddd}
#startButton{display:none;min-width:160px;padding:15px 24px;background:#4caf50;color:#fff;border:0;border-radius:8px;font:bold 16px "Courier New",monospace;cursor:pointer}
#game{display:none;width:100%;height:100%;max-width:100%;max-height:100%}
#game canvas{max-width:100%;max-height:100%;object-fit:contain}
#status{color:#aaa;font-size:13px;text-align:center}
</style>
</head>
<body>
<div id="shell">
<div id="status">Choose a GBA game file you are authorised to use.</div>
<input id="picker" type="file" accept=".gba,.zip">
<button id="startButton" type="button">START GAME</button>
<div id="game"></div>
</div>
<script>
const picker=document.getElementById("picker");
const startButton=document.getElementById("startButton");
const game=document.getElementById("game");
const statusText=document.getElementById("status");
let selectedFile=null;
let gameObjectUrl=null;
let loading=false;
picker.addEventListener("change",()=>{
 selectedFile=picker.files&&picker.files[0];
 startButton.style.display=selectedFile?"block":"none";
 statusText.textContent=selectedFile?"Selected: "+selectedFile.name:"Choose a GBA game file you are authorised to use.";
});
startButton.addEventListener("click",()=>{
 if(!selectedFile||loading)return;
 loading=true;
 startButton.disabled=true;
 picker.style.display="none";
 startButton.style.display="none";
 game.style.display="block";
 statusText.textContent="Loading EmulatorJS…";
 gameObjectUrl=URL.createObjectURL(selectedFile);
 window.EJS_player="#game";
 window.EJS_core="gba";
 window.EJS_gameName=selectedFile.name;
 window.EJS_color="#000000";
 window.EJS_startOnLoaded=true;
 window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
 window.EJS_gameUrl=gameObjectUrl;
 const loader=document.createElement("script");
 loader.src="https://cdn.emulatorjs.org/stable/data/loader.js";
 loader.onerror=()=>{
  statusText.textContent="EmulatorJS couldn't load. Check your connection and refresh.";
  loading=false;
  startButton.disabled=false;
 };
 document.body.appendChild(loader);
});
</script>
</body>
</html>
