<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extra Games | Flashcard.com</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:"Courier New",monospace}
header{padding:18px 26px;background:#101010;border-bottom:2px solid #333;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:30px;margin:0}.sub{color:#777;margin:8px 0 0}.wrap{width:min(1100px,94%);margin:auto;padding:34px 0 60px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:25px}
.game{background:#111;border:2px solid #333;color:#eee;text-decoration:none;min-height:165px;padding:25px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.game:hover{background:#191919;border-color:#777;transform:translateY(-2px)}
.icon{font-size:42px}.name{font-size:19px;font-weight:bold}.description{color:#777;font-size:12px;margin-top:7px}
button{background:#eee;color:#111;border:0;padding:10px 15px;font-family:inherit;font-weight:bold;cursor:pointer}

</style>
</head>
<body>
<header><div><h1>EXTRA GAMES</h1><div class="sub">More games from across your GitHub Pages projects.</div></div><button onclick="location.href='index.html'">BACK</button></header>
<main class="wrap"><div class="empty-message" style="margin-top:30px;padding:30px;border:2px solid #333;background:#111;color:#aaa;text-align:center">All games have been moved back to the main Flashcard.com hub.</div>

</body></html>
