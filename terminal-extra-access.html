<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extra Access</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f7fc;color:#1d2a3a}
body{display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #dce5ef;border-top:5px solid #1769e0;border-radius:14px;padding:34px;box-shadow:0 8px 30px #1e3c5e20;text-align:center}
.logo{width:48px;height:48px;border-radius:12px;background:#e8f1ff;color:#1769e0;display:grid;place-items:center;font-size:24px;font-weight:bold;margin:0 auto 18px}
h1{font-size:24px;color:#1769e0;margin:0 0 10px}p{color:#718096;line-height:1.55}label{display:block;text-align:left;font-size:13px;font-weight:bold;margin:22px 0 8px}
input{width:100%;padding:14px;border:1px solid #ccd7e3;border-radius:8px;font-size:16px;color:#1d2a3a}input:focus{outline:2px solid #1769e0}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}
#message{min-height:20px;font-size:13px;color:#c53030}
</style></head><body><form class="card" id="question"><div class="logo">F</div><h1>Welcome to Extra Access</h1><p>Complete the verification question to continue.</p><label for="answer">0 = :) Calculate mass of sun</label><input id="answer" inputmode="numeric" autocomplete="off" placeholder="Enter your answer" required><button type="submit">CONTINUE</button><div id="message" aria-live="polite"></div></form>
<script>document.getElementById("question").addEventListener("submit",e=>{e.preventDefault();const a=document.getElementById("answer"),m=document.getElementById("message");if(a.value.trim()==="67"){location.href="extra-games.html"}else{m.textContent="That answer is not correct. Try again.";a.select()}});</script></body></html>
