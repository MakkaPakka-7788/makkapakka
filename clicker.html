<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10151f">
<title>Star Clicker</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#141d2a;--line:#28384d;--text:#eef5ff;--muted:#9bb0c8;--blue:#64c7ff;--gold:#ffd166;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 50% -10%,#183653 0,transparent 48%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}.wrap{width:min(1000px,100%);margin:auto;padding:28px 20px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:14px;font-weight:800;letter-spacing:.16em;color:var(--blue)}.save{font-size:12px;color:var(--muted)}
h1{text-align:center;font-size:clamp(32px,6vw,54px);letter-spacing:-.05em;margin:42px 0 4px}.subtitle{text-align:center;color:var(--muted);margin:0 0 28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:650px;margin:0 auto 20px}.stat{padding:14px;text-align:center;background:#101925cc;border:1px solid var(--line);border-radius:14px}.stat strong{display:block;font-size:clamp(19px,4vw,28px);font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.play-area{position:relative;min-height:285px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#111b29,#0f1722);box-shadow:0 18px 60px #0005}.play-area:before,.play-area:after{content:"✦";position:absolute;color:#7398b455;font-size:26px}.play-area:before{top:22%;left:16%}.play-area:after{right:17%;bottom:22%;font-size:18px}
#star{width:190px;height:190px;display:grid;place-items:center;border:0;background:transparent;font-size:140px;line-height:1;filter:drop-shadow(0 0 22px #ffd16666);transition:transform .12s;touch-action:manipulation;user-select:none}#star:hover{transform:scale(1.06)}#star:active{transform:scale(.88)}#star:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:50%}
.float{position:absolute;pointer-events:none;color:var(--gold);font-weight:900;animation:float .8s ease-out forwards;text-shadow:0 2px 10px #000}@keyframes float{to{transform:translateY(-75px);opacity:0}}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 2px 12px}.section-title h2{font-size:16px;margin:0}.section-title span{color:var(--muted);font-size:12px}
.upgrades{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.upgrade{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);transition:border-color .15s,transform .15s}.upgrade:hover:not(:disabled){border-color:#578ab3;transform:translateY(-1px)}.upgrade:disabled{opacity:.55;cursor:not-allowed}.upgrade .icon{font-size:28px}.upgrade .details{flex:1;min-width:0}.upgrade strong{display:block}.upgrade small{display:block;color:var(--muted);margin-top:3px}.upgrade .price{color:var(--gold);font-size:13px;font-weight:800;white-space:nowrap}
.reset{display:block;margin:22px auto 0;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--muted);font-size:12px}.reset:hover{color:var(--text);border-color:#60758b}
@media(max-width:560px){.wrap{padding:18px 14px 32px}.stats{gap:6px}.stat{padding:11px 4px}.play-area{min-height:245px}.upgrades{grid-template-columns:1fr}.upgrade{padding:12px}.section-title{margin-top:20px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">✦ STAR CLICKER</div><div class="save" id="saveStatus" aria-live="polite">Saved on this device</div></header>
<h1>Make a little stardust.</h1><p class="subtitle">Tap the star. Build your tiny space empire.</p>
<section class="stats" aria-label="Game stats">
<div class="stat"><strong id="score">0</strong><span>Stardust</span></div>
<div class="stat"><strong id="perClick">1</strong><span>Per tap</span></div>
<div class="stat"><strong id="perSecond">0</strong><span>Per second</span></div>
</section>
<section class="play-area" aria-label="Tap zone"><button id="star" aria-label="Collect stardust">⭐</button></section>
<div class="section-title"><h2>Build your crew</h2><span>Upgrades save automatically</span></div>
<section class="upgrades" aria-label="Upgrades">
<button class="upgrade" data-upgrade="click"><span class="icon">🧑‍🚀</span><span class="details"><strong>Astro gloves</strong><small>+1 stardust per tap · Owned: <b id="clickOwned">0</b></small></span><span class="price" id="clickCost">Cost 25</span></button>
<button class="upgrade" data-upgrade="drone"><span class="icon">🛰️</span><span class="details"><strong>Star drone</strong><small>+1 stardust per second · Owned: <b id="droneOwned">0</b></small></span><span class="price" id="droneCost">Cost 50</span></button>
<button class="upgrade" data-upgrade="telescope"><span class="icon">🔭</span><span class="details"><strong>Deep-space scope</strong><small>+10 stardust per tap · Owned: <b id="scopeOwned">0</b></small></span><span class="price" id="scopeCost">Cost 250</span></button>
<button class="upgrade" data-upgrade="station"><span class="icon">🚀</span><span class="details"><strong>Orbit station</strong><small>+10 stardust per second · Owned: <b id="stationOwned">0</b></small></span><span class="price" id="stationCost">Cost 500</span></button>
</section>
<button class="reset" id="reset">Start over</button>
</main>
<script>
const defaults={dust:0,gloves:0,drones:0,scopes:0,stations:0};
let state={...defaults};try{state={...defaults,...JSON.parse(localStorage.getItem("starClicker.save")||"{}")}}catch{}
const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString();
const costs={gloves:25,drones:50,scopes:250,stations:500};
function income(){return state.drones+state.stations*10}
function power(){return 1+state.gloves+state.scopes*10}
function price(key){return Math.floor(costs[key]*Math.pow(key==="gloves"?1.55:key==="drones"?1.6:1.7,state[key]))}
function save(){try{localStorage.setItem("starClicker.save",JSON.stringify(state));$("saveStatus").textContent="Saved on this device"}catch{$("saveStatus").textContent="Save unavailable"}}
function render(){ $("score").textContent=fmt(state.dust);$("perClick").textContent=fmt(power());$("perSecond").textContent=fmt(income());
for(const [key,label] of [["gloves","click"],["drones","drone"],["scopes","scope"],["stations","station"]]){$(label+"Owned").textContent=state[key];$(label+"Cost").textContent="Cost "+fmt(price(key));document.querySelector('[data-upgrade="'+(key==="gloves"?"click":key==="drones"?"drone":key==="scopes"?"telescope":"station")+'"]').disabled=state.dust<price(key)}
}
function collect(x,y){state.dust+=power();save();render();const el=document.createElement("span");el.className="float";el.textContent="+"+fmt(power());el.style.left=x+"px";el.style.top=y+"px";document.querySelector(".play-area").append(el);setTimeout(()=>el.remove(),850)}
$("star").addEventListener("click",e=>collect(e.clientX,e.clientY));
document.querySelectorAll(".upgrade").forEach(b=>b.addEventListener("click",()=>{const key=({click:"gloves",drone:"drones",telescope:"scopes",station:"stations"})[b.dataset.upgrade],cost=price(key);if(state.dust<cost)return;state.dust-=cost;state[key]++;save();render()}));
setInterval(()=>{if(income()>0){state.dust+=income();save();render()}},1000);
$("reset").addEventListener("click",()=>{if(confirm("Start over and erase your saved stardust?")){state={...defaults};save();render()}});
render();
</script>
</body>
</html>
