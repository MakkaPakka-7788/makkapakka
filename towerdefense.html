<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kingdom War</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080808;
color:#eee;
font-family:"Courier New",monospace;
overflow:hidden;
}
#stats{
height:42px;
background:#111;
border-bottom:2px solid #333;
display:flex;
align-items:center;
gap:18px;
padding:0 14px;
font-size:14px;
white-space:nowrap;
}
#gameWrap{
width:100vw;
height:calc(100vh - 42px);
position:relative;
overflow:hidden;
background:#111;
}
canvas{
display:block;
background:#151515;
cursor:grab;
}
canvas.dragging{cursor:grabbing}
#towerInfo{
position:absolute;
right:10px;
top:10px;
width:225px;
background:#111;
border:2px solid #444;
padding:10px;
font-size:12px;
z-index:5;
}
#towerInfo h3{
margin:0 0 8px;
font-size:15px;
}
#towerInfo div{margin:4px 0}
.toolbar{
position:absolute;
left:10px;
bottom:10px;
background:#111;
border:2px solid #444;
padding:8px;
z-index:5;
}
#towerbar{
display:grid;
grid-template-columns:repeat(10,74px);
gap:5px;
}
button{
font-family:"Courier New",monospace;
background:#181818;
color:#eee;
border:2px solid #444;
padding:6px;
cursor:pointer;
font-size:11px;
}
button:hover{
background:#292929;
border-color:#777;
}
button.selected{
background:#333;
border-color:#fff;
}
button.locked{
opacity:.35;
cursor:not-allowed;
}
#controls{
position:absolute;
left:10px;
top:10px;
display:flex;
gap:5px;
flex-wrap:wrap;
max-width:530px;
z-index:6;
}
#controls button{font-size:12px}
#terrainBar{
position:absolute;
left:10px;
bottom:116px;
background:#111;
border:2px solid #444;
padding:7px;
z-index:5;
display:flex;
gap:4px;
flex-wrap:wrap;
width:480px;
}
#terrainBar button{font-size:10px}
#troopBar{
position:absolute;
left:10px;
bottom:67px;
background:#111;
border:2px solid #444;
padding:7px;
z-index:5;
display:flex;
gap:5px;
}
.castlebar{
position:absolute;
left:50%;
bottom:8px;
transform:translateX(-50%);
width:300px;
height:18px;
border:2px solid #555;
background:#222;
z-index:4;
}
#castleFill{
height:100%;
width:100%;
background:#4caf50;
}
#castleText{
position:absolute;
left:0;
top:0;
width:100%;
text-align:center;
font-size:11px;
line-height:14px;
}
#savebar{
position:absolute;
right:10px;
bottom:10px;
display:flex;
gap:5px;
z-index:5;
}
#info{
position:absolute;
right:10px;
bottom:10px;
width:225px;
font-size:10px;
color:#aaa;
z-index:5;
transform:translateY(-42px);
}
#overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.82);
display:none;
align-items:center;
justify-content:center;
z-index:20;
text-align:center;
}
#overlayBox{
border:3px solid #777;
background:#111;
padding:30px;
min-width:300px;
}
#overlay h1{
margin:0 0 15px;
font-size:28px;
}
#overlay button{
font-size:15px;
padding:10px 18px;
margin:5px;
}
#terrainUpgrade{
margin-top:8px;
width:100%;
}
</style>
</head>
<body>

<div id="stats">
<span id="money">$5000</span>
<span id="wave">WAVE 1</span>
<span id="level">LEVEL 1</span>
<span id="kills">KILLS 0</span>
<span id="selectedText">SELECT: NONE</span>
</div>

<div id="gameWrap">
<canvas id="game"></canvas>

<div id="controls">
<button id="upgradeBtn">UPGRADE</button>
<button id="sellBtn">DELETE / SELL</button>
<button id="roadBtn">BUILD ROAD</button>
<button id="pauseBtn">PAUSE</button>
</div>

<div id="towerInfo">
<h3 id="infoTitle">KINGDOM WAR</h3>
<div id="infoBody">Select a tower to see its information.</div>
<button id="terrainUpgrade">UPGRADE TERRAIN</button>
</div>

<div id="terrainBar">
<button data-terrain="forest">FOREST $150</button>
<button data-terrain="hills">HILLS $150</button>
<button data-terrain="crystal">CRYSTAL $150</button>
<button data-terrain="mountain">MOUNTAIN $150</button>
<button data-terrain="swamp">SWAMP $150</button>
<button data-terrain="ice">ICE $150</button>
<button data-terrain="desert">DESERT $150</button>
<button data-terrain="plains">PLAINS $150</button>
</div>

<div id="troopBar">
<button id="soldierBtn">SOLDIER $120</button>
<button id="knightBtn">KNIGHT $300</button>
<button id="archerBtn">ARCHER $180</button>
</div>

<div class="castlebar">
<div id="castleFill"></div>
<div id="castleText">CASTLE 1000 / 1000</div>
</div>

<div id="savebar">
<button id="saveBtn">SAVE</button>
<button id="loadBtn">LOAD</button>
<button id="newBtn">NEW CITY</button>
</div>

<div id="info">Click and drag the map to move it. Scroll to zoom. Build roads, towers and terrain.</div>

<div id="overlay">
<div id="overlayBox">
<h1 id="overlayTitle">KINGDOM LOST</h1>
<div id="overlayText">The castle has fallen.</div>
<br>
<button id="retryBtn">RETRY</button>
<button id="homeBtn">HOME</button>
</div>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight-42;
canvas.width=W;
canvas.height=H;

const world={w:2200,h:1200};
const grid=50;

let camera={x:0,y:0,zoom:.72};
let dragging=false;
let dragMoved=false;
let lastMouse={x:0,y:0};

let money=5000;
let wave=1;
let kills=0;
let castleHP=1000;
let paused=false;
let gameOver=false;
let selectedTower=null;
let selectedBuild=null;
let selectedTerrain=null;
let roadMode=false;

let towers=[];
let enemies=[];
let projectiles=[];
let particles=[];
let troops=[];
let terrainTiles=[];
let roads=[];
let nextEnemy=0;
let spawnTimer=0;
let waveTimer=0;
let waveActive=false;
let gameTime=0;
let lastTime=performance.now();

const terrainTypes={
forest:{name:"Forest",color:"#315c38",bonus:1.25,buffs:["Rapid","Poison","Flame"]},
hills:{name:"Hills",color:"#75633c",bonus:1.25,buffs:["Heavy","Sniper","Ballista"]},
crystal:{name:"Crystal",color:"#704f91",bonus:1.30,buffs:["Crystal","Tesla","Laser"]},
mountain:{name:"Mountain",color:"#555962",bonus:1.25,buffs:["King","Mortar","Catapult"]},
swamp:{name:"Swamp",color:"#3d6351",bonus:1.30,buffs:["Poison","Slow","Void"]},
ice:{name:"Ice",color:"#507b88",bonus:1.30,buffs:["Ice","Freeze","Guardian"]},
desert:{name:"Desert",color:"#876b3f",bonus:1.25,buffs:["Flame","Meteor","Catapult"]},
plains:{name:"Plains",color:"#66704a",bonus:1.20,buffs:["Basic","Splash","Guardian"]}
};

const towerTypes=[
{name:"Basic",cost:60,damage:22,range:125,rate:700,color:"#4da6ff",unlock:1},
{name:"Rapid",cost:90,damage:10,range:135,rate:220,color:"#ffcc33",unlock:1},
{name:"Heavy",cost:140,damage:65,range:145,rate:1100,color:"#ff7043",unlock:1},
{name:"Slow",cost:120,damage:12,range:150,rate:800,color:"#8e9eff",unlock:1},
{name:"Splash",cost:170,damage:35,range:135,rate:1000,color:"#ff4d88",unlock:1},
{name:"Laser",cost:230,damage:18,range:190,rate:170,color:"#ff3333",unlock:2},
{name:"Freeze",cost:250,damage:9,range:155,rate:700,color:"#66eaff",unlock:2},
{name:"Poison",cost:280,damage:14,range:160,rate:600,color:"#9cff33",unlock:2},
{name:"Sniper",cost:350,damage:150,range:300,rate:1900,color:"#d9d9d9",unlock:3},
{name:"Tesla",cost:420,damage:38,range:175,rate:850,color:"#b266ff",unlock:3},
{name:"Mortar",cost:480,damage:80,range:250,rate:1800,color:"#a87952",unlock:3},
{name:"Flame",cost:520,damage:17,range:105,rate:260,color:"#ff6600",unlock:4},
{name:"Ice",cost:580,damage:28,range:180,rate:650,color:"#99ffff",unlock:4},
{name:"Ballista",cost:650,damage:220,range:280,rate:2400,color:"#b58a5a",unlock:5},
{name:"Catapult",cost:700,damage:125,range:260,rate:2100,color:"#806040",unlock:5},
{name:"Void",cost:800,damage:100,range:220,rate:1000,color:"#7b4dff",unlock:6},
{name:"Meteor",cost:950,damage:250,range:290,rate:2600,color:"#ff452e",unlock:7},
{name:"Crystal",cost:1100,damage:70,range:240,rate:500,color:"#e8aaff",unlock:7},
{name:"Guardian",cost:1400,damage:120,range:200,rate:700,color:"#59d98e",unlock:8},
{name:"King",cost:2000,damage:300,range:350,rate:1800,color:"#ffd700",unlock:9}
];

const roadPoints=[
{x:1740,y:475},
{x:1600,y:475},
{x:1450,y:475},
{x:1300,y:475},
{x:1150,y:475},
{x:1000,y:475},
{x:850,y:475},
{x:700,y:475},
{x:550,y:475},
{x:400,y:475},
{x:250,y:475}
];

const enemyTypes=[
{name:"Goblin",hp:90,speed:26,damage:20,reward:15},
{name:"Orc",hp:220,speed:20,damage:35,reward:30},
{name:"Knight",hp:500,speed:16,damage:55,reward:55},
{name:"Troll",hp:1000,speed:12,damage:90,reward:100},
{name:"Demon",hp:2200,speed:10,damage:150,reward:200}
];

function resize(){
W=window.innerWidth;
H=window.innerHeight-42;
canvas.width=W;
canvas.height=H;
}
window.addEventListener("resize",resize);

function worldToScreen(x,y){
return{
x:(x-camera.x)*camera.zoom,
y:(y-camera.y)*camera.zoom
};
}

function screenToWorld(x,y){
return{
x:x/camera.zoom+camera.x,
y:y/camera.zoom+camera.y
};
}

function dist(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}

function snap(v){
return Math.floor(v/grid)*grid+grid/2;
}

function towerAt(x,y){
return towers.find(t=>dist(t,{x,y})<25);
}

function terrainAt(x,y){
return terrainTiles.find(t=>t.x===x&&t.y===y);
}

function roadAt(x,y){
return roads.find(r=>r.x===x&&r.y===y);
}

function zoneUpgradeCost(type){
const tiles=terrainTiles.filter(t=>t.type===type).length;
if(!tiles)return Infinity;
const level=(terrainLevels[type]||1);
return Math.floor((900+tiles*180)*Math.pow(2.15,level-1));
}

let terrainLevels={
forest:1,hills:1,crystal:1,mountain:1,
swamp:1,ice:1,desert:1,plains:1
};

function terrainBonus(type){
const base=terrainTypes[type].bonus;
const level=terrainLevels[type]||1;
return 1+(base-1)*level;
}

function towerBuff(t){
const tile=terrainAt(t.x,t.y);
if(!tile)return 1;
const terrain=terrainTypes[tile.type];
if(!terrain.buffs.includes(t.type.name))return 1;
return terrainBonus(tile.type);
}

function upgradeCost(t){
return Math.floor(t.type.cost*1.8**t.level);
}

function towerStats(t){
const mult=1+(t.level-1)*.55;
const buff=towerBuff(t);
return{
damage:t.type.damage*mult*buff,
range:t.type.range*(1+(t.level-1)*.08),
rate:Math.max(80,t.type.rate/(1+(t.level-1)*.12)/buff)
};
}

function drawGrid(){
ctx.fillStyle="#161616";
ctx.fillRect(0,0,W,H);

const startX=Math.floor(camera.x/grid)*grid-grid;
const endX=camera.x+W/camera.zoom+grid;
const startY=Math.floor(camera.y/grid)*grid-grid;
const endY=camera.y+H/camera.zoom+grid;

ctx.strokeStyle="rgba(255,255,255,.045)";
ctx.lineWidth=1;

for(let x=startX;x<endX;x+=grid){
const a=worldToScreen(x,0);
ctx.beginPath();
ctx.moveTo(a.x,0);
ctx.lineTo(a.x,H);
ctx.stroke();
}

for(let y=startY;y<endY;y+=grid){
const a=worldToScreen(0,y);
ctx.beginPath();
ctx.moveTo(0,a.y);
ctx.lineTo(W,a.y);
ctx.stroke();
}
}

function drawTerrain(){
for(const tile of terrainTiles){
const p=worldToScreen(tile.x,tile.y);
const s=grid*camera.zoom;
const type=terrainTypes[tile.type];

ctx.fillStyle=type.color;
ctx.fillRect(p.x-s/2+1,p.y-s/2+1,s-2,s-2);

ctx.strokeStyle="rgba(255,255,255,.15)";
ctx.strokeRect(p.x-s/2+1,p.y-s/2+1,s-2,s-2);

ctx.fillStyle="rgba(255,255,255,.15)";
if(tile.type==="forest"){
for(let i=-15;i<=15;i+=15){
ctx.beginPath();
ctx.arc(p.x+i*.6,p.y-5,5*camera.zoom,0,Math.PI*2);
ctx.fill();
}
}else if(tile.type==="hills"){
ctx.beginPath();
ctx.moveTo(p.x-s*.35,p.y+s*.25);
ctx.lineTo(p.x,p.y-s*.25);
ctx.lineTo(p.x+s*.35,p.y+s*.25);
ctx.fill();
}else if(tile.type==="crystal"){
ctx.beginPath();
ctx.moveTo(p.x,p.y-s*.3);
ctx.lineTo(p.x+s*.12,p.y);
ctx.lineTo(p.x,p.y+s*.3);
ctx.lineTo(p.x-s*.12,p.y);
ctx.closePath();
ctx.fill();
}else if(tile.type==="mountain"){
ctx.beginPath();
ctx.moveTo(p.x-s*.35,p.y+s*.3);
ctx.lineTo(p.x-s*.05,p.y-s*.3);
ctx.lineTo(p.x+s*.3,p.y+s*.3);
ctx.fill();
}else if(tile.type==="swamp"){
ctx.beginPath();
ctx.arc(p.x,p.y,8*camera.zoom,0,Math.PI*2);
ctx.fill();
}else if(tile.type==="ice"){
ctx.beginPath();
ctx.moveTo(p.x-s*.3,p.y);
ctx.lineTo(p.x,p.y-s*.3);
ctx.lineTo(p.x+s*.3,p.y);
ctx.lineTo(p.x,p.y+s*.3);
ctx.closePath();
ctx.fill();
}else if(tile.type==="desert"){
ctx.fillRect(p.x-10*camera.zoom,p.y-2*camera.zoom,20*camera.zoom,4*camera.zoom);
}else{
ctx.beginPath();
ctx.arc(p.x,p.y,3*camera.zoom,0,Math.PI*2);
ctx.fill();
}
}
}

function drawRoads(){
for(const r of roads){
const p=worldToScreen(r.x,r.y);
const s=grid*camera.zoom;
ctx.fillStyle="#373737";
ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
ctx.strokeStyle="#666";
ctx.strokeRect(p.x-s/2,p.y-s/2,s,s);
ctx.fillStyle="#bda94d";
ctx.fillRect(p.x-s*.08,p.y-s*.5,s*.16,s);
}
}

function drawPath(){
ctx.strokeStyle="#555";
ctx.lineWidth=grid*camera.zoom*.72;
ctx.lineCap="round";
ctx.beginPath();
for(let i=0;i<roadPoints.length;i++){
const p=worldToScreen(roadPoints[i].x,roadPoints[i].y);
if(i===0)ctx.moveTo(p.x,p.y);
else ctx.lineTo(p.x,p.y);
}
ctx.stroke();

ctx.strokeStyle="#aaa";
ctx.lineWidth=2;
ctx.setLineDash([12,12]);
ctx.beginPath();
for(let i=0;i<roadPoints.length;i++){
const p=worldToScreen(roadPoints[i].x,roadPoints[i].y);
if(i===0)ctx.moveTo(p.x,p.y);
else ctx.lineTo(p.x,p.y);
}
ctx.stroke();
ctx.setLineDash([]);
}

function drawCastle(){
const p=worldToScreen(250,475);
const s=70*camera.zoom;

ctx.fillStyle="#666";
ctx.fillRect(p.x-s/2,p.y-s/2,s,s);

ctx.fillStyle="#888";
ctx.fillRect(p.x-s*.42,p.y-s*.65,s*.18,s*.35);
ctx.fillRect(p.x+s*.24,p.y-s*.65,s*.18,s*.35);

ctx.fillStyle="#222";
ctx.fillRect(p.x-s*.12,p.y+s*.05,s*.24,s*.45);

ctx.fillStyle="#c33";
ctx.fillRect(p.x-s*.13,p.y-s*.78,s*.26,s*.13);
}

function drawEnemyBase(){
const p=worldToScreen(1740,475);
const s=70*camera.zoom;
ctx.fillStyle="#4b2525";
ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
ctx.fillStyle="#b33";
ctx.fillRect(p.x-s*.15,p.y-s*.65,s*.3,s*.3);
}

function drawTowers(){
for(const t of towers){
const p=worldToScreen(t.x,t.y);
const s=34*camera.zoom;
const stats=towerStats(t);

ctx.fillStyle=t.type.color;
ctx.fillRect(p.x-s/2,p.y-s/2,s,s);

ctx.strokeStyle="#111";
ctx.lineWidth=3;
ctx.strokeRect(p.x-s/2,p.y-s/2,s,s);

ctx.fillStyle="#111";
ctx.fillRect(p.x-3*camera.zoom,p.y-18*camera.zoom,6*camera.zoom,12*camera.zoom);

if(selectedTower===t){
ctx.beginPath();
ctx.strokeStyle="rgba(255,255,255,.45)";
ctx.lineWidth=2;
ctx.arc(p.x,p.y,stats.range*camera.zoom,0,Math.PI*2);
ctx.stroke();
}

ctx.fillStyle="#fff";
ctx.font=`${10*camera.zoom}px Courier New`;
ctx.textAlign="center";
ctx.fillText(t.level,p.x,p.y+4*camera.zoom);
}
}

function drawTroops(){
for(const t of troops){
const p=worldToScreen(t.x,t.y);
ctx.fillStyle=t.type==="Knight"?"#ddd":t.type==="Archer"?"#7fc":"#aaa";
ctx.fillRect(p.x-7*camera.zoom,p.y-7*camera.zoom,14*camera.zoom,14*camera.zoom);
}
}

function drawEnemies(){
for(const e of enemies){
const p=worldToScreen(e.x,e.y);
const r=10*camera.zoom;

ctx.fillStyle=e.color;
ctx.beginPath();
ctx.arc(p.x,p.y,r,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#222";
ctx.fillRect(p.x-r,p.y-r-7*camera.zoom,r*2,4*camera.zoom);

ctx.fillStyle="#4caf50";
ctx.fillRect(p.x-r,p.y-r-7*camera.zoom,r*2*(e.hp/e.maxHp),4*camera.zoom);
}
}

function drawProjectiles(){
for(const p of projectiles){
const a=worldToScreen(p.x,p.y);
ctx.fillStyle=p.color||"#fff";
ctx.beginPath();
ctx.arc(a.x,a.y,3*camera.zoom,0,Math.PI*2);
ctx.fill();
}
}

function drawParticles(){
for(const p of particles){
const a=worldToScreen(p.x,p.y);
ctx.globalAlpha=p.life;
ctx.fillStyle=p.color;
ctx.fillRect(a.x-2,a.y-2,4,4);
ctx.globalAlpha=1;
}
}

function draw(){
drawGrid();
drawTerrain();
drawRoads();
drawPath();
drawCastle();
drawEnemyBase();
drawTowers();
drawTroops();
drawEnemies();
drawProjectiles();
drawParticles();

if(selectedBuild){
const m=mouseWorld;
if(m){
const x=snap(m.x);
const y=snap(m.y);
const p=worldToScreen(x,y);
ctx.strokeStyle="#fff";
ctx.lineWidth=2;
ctx.strokeRect(
p.x-grid*camera.zoom/2,
p.y-grid*camera.zoom/2,
grid*camera.zoom,
grid*camera.zoom
);
}
}
}

let mouseWorld=null;

canvas.addEventListener("pointerdown",e=>{
dragging=true;
dragMoved=false;
lastMouse={x:e.clientX,y:e.clientY};
canvas.classList.add("dragging");
canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
const dx=e.clientX-lastMouse.x;
const dy=e.clientY-lastMouse.y;

if(dragging){
if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
camera.x-=dx/camera.zoom;
camera.y-=dy/camera.zoom;
camera.x=Math.max(0,Math.min(world.w-W/camera.zoom,camera.x));
camera.y=Math.max(0,Math.min(world.h-H/camera.zoom,camera.y));
lastMouse={x:e.clientX,y:e.clientY};
}

mouseWorld=screenToWorld(e.offsetX,e.offsetY);
});

canvas.addEventListener("pointerup",e=>{
dragging=false;
canvas.classList.remove("dragging");

if(!dragMoved)handleMapClick(e.offsetX,e.offsetY);
});

canvas.addEventListener("pointerleave",()=>{
mouseWorld=null;
});

canvas.addEventListener("wheel",e=>{
e.preventDefault();

const before=screenToWorld(e.offsetX,e.offsetY);
const factor=e.deltaY<0?1.12:.89;
camera.zoom=Math.max(.35,Math.min(1.5,camera.zoom*factor));
const after=screenToWorld(e.offsetX,e.offsetY);

camera.x+=before.x-after.x;
camera.y+=before.y-after.y;

camera.x=Math.max(0,Math.min(world.w-W/camera.zoom,camera.x));
camera.y=Math.max(0,Math.min(world.h-H/camera.zoom,camera.y));
},{passive:false});

function handleMapClick(sx,sy){
const p=screenToWorld(sx,sy);
const x=snap(p.x);
const y=snap(p.y);

if(x<25||x>world.w-25||y<25||y>world.h-25)return;

if(roadMode){
buildRoad(x,y);
return;
}

if(selectedTerrain){
buildTerrain(x,y,selectedTerrain);
return;
}

if(selectedBuild){
buildTower(x,y,selectedBuild);
return;
}

const t=towerAt(x,y);
if(t){
selectedTower=t;
selectedBuild=null;
selectedTerrain=null;
updateInfo();
return;
}

selectedTower=null;
updateInfo();
}

function buildRoad(x,y){
if(roadAt(x,y))return;
if(towerAt(x,y))return;
if(terrainAt(x,y))return;

if(money<20)return;

money-=20;
roads.push({x,y});
updateUI();
}

function buildTerrain(x,y,type){
if(terrainAt(x,y)||roadAt(x,y)||towerAt(x,y))return;
if(money<150)return;

money-=150;
terrainTiles.push({x,y,type});
updateUI();
saveGame();
}

function buildTower(x,y,index){
const type=towerTypes[index];

if(type.unlock>wave)return;
if(towerAt(x,y)||roadAt(x,y)||terrainAt(x,y))return;
if(x<100&&y>400&&y<550)return;
if(money<type.cost)return;

money-=type.cost;

towers.push({
x,
y,
type,
level:1,
cooldown:0,
kills:0
});

selectedTower=towers[towers.length-1];
selectedBuild=null;
updateUI();
updateInfo();
}

function upgradeTower(){
if(!selectedTower)return;

const cost=upgradeCost(selectedTower);
if(money<cost)return;

money-=cost;
selectedTower.level++;
updateUI();
updateInfo();
saveGame();
}

function sellTower(){
if(!selectedTower)return;

const value=Math.floor(selectedTower.type.cost*(.65+.2*(selectedTower.level-1)));
money+=value;

towers=towers.filter(t=>t!==selectedTower);
selectedTower=null;

updateUI();
updateInfo();
saveGame();
}

function updateInfo(){
if(!selectedTower){
document.getElementById("infoTitle").textContent="KINGDOM WAR";
document.getElementById("infoBody").innerHTML=
"Select a tower to see its information.<br><br>Build terrain to create tower buffs.";
return;
}

const t=selectedTower;
const s=towerStats(t);
const cost=upgradeCost(t);
const tile=terrainAt(t.x,t.y);

document.getElementById("infoTitle").textContent=
`${t.type.name} LV ${t.level}`;

document.getElementById("infoBody").innerHTML=
`Damage: ${Math.floor(s.damage)}<br>
Range: ${Math.floor(s.range)}<br>
Attack: ${Math.floor(s.rate)} ms<br>
Kills: ${t.kills}<br>
Upgrade: $${cost}<br>
Terrain: ${tile?terrainTypes[tile.type].name:"None"}<br>
Buff: ${tile&&terrainTypes[tile.type].buffs.includes(t.type.name)?"ACTIVE":"NONE"}`;
}

function updateUI(){
document.getElementById("money").textContent="$"+Math.floor(money);
document.getElementById("wave").textContent="WAVE "+wave;
document.getElementById("level").textContent="LEVEL "+Math.min(10,Math.floor(wave/2)+1);
document.getElementById("kills").textContent="KILLS "+kills;
document.getElementById("selectedText").textContent=
"SELECT: "+(selectedTower?selectedTower.type.name:"NONE");

document.getElementById("castleFill").style.width=
Math.max(0,castleHP/1000*100)+"%";

document.getElementById("castleText").textContent=
"CASTLE "+Math.max(0,Math.floor(castleHP))+" / 1000";

for(const [i,type] of towerTypes.entries()){
const b=document.getElementById("tower"+i);
if(!b)continue;
if(type.unlock>wave)b.classList.add("locked");
else b.classList.remove("locked");
}

updateInfo();
}

for(let i=0;i<towerTypes.length;i++){
const b=document.createElement("button");
b.id="tower"+i;
b.textContent=towerTypes[i].name+" $"+towerTypes[i].cost;
b.onclick=()=>{
if(towerTypes[i].unlock>wave)return;
selectedBuild=i;
selectedTerrain=null;
selectedTower=null;
roadMode=false;
updateInfo();
};
document.getElementById("towerbar")?.appendChild(b);
}

const bar=document.getElementById("terrainBar");
document.getElementById("towerInfo").appendChild(document.createElement("div"));
const towerBar=document.createElement("div");
towerBar.id="towerbar";
towerBar.style.position="absolute";
towerBar.style.left="10px";
towerBar.style.bottom="165px";
towerBar.style.background="#111";
towerBar.style.border="2px solid #444";
towerBar.style.padding="7px";
towerBar.style.zIndex="5";
towerBar.style.display="grid";
towerBar.style.gridTemplateColumns="repeat(10,74px)";
towerBar.style.gap="5px";
document.getElementById("gameWrap").appendChild(towerBar);

for(let i=0;i<towerTypes.length;i++){
const b=document.createElement("button");
b.id="tower"+i;
b.textContent=towerTypes[i].name+" $"+towerTypes[i].cost;
b.onclick=()=>{
if(towerTypes[i].unlock>wave)return;
selectedBuild=i;
selectedTerrain=null;
selectedTower=null;
roadMode=false;
updateInfo();
};
towerBar.appendChild(b);
}

document.querySelectorAll("[data-terrain]").forEach(b=>{
b.onclick=()=>{
selectedTerrain=b.dataset.terrain;
selectedBuild=null;
selectedTower=null;
roadMode=false;
updateInfo();
};
});

document.getElementById("upgradeBtn").onclick=upgradeTower;
document.getElementById("sellBtn").onclick=sellTower;

document.getElementById("roadBtn").onclick=()=>{
roadMode=!roadMode;
selectedBuild=null;
selectedTerrain=null;
selectedTower=null;
updateInfo();
};

document.getElementById("pauseBtn").onclick=()=>{
paused=!paused;
document.getElementById("pauseBtn").textContent=paused?"RESUME":"PAUSE";
};

document.getElementById("terrainUpgrade").onclick=()=>{
if(!selectedTerrain)return;

const cost=zoneUpgradeCost(selectedTerrain);
if(cost===Infinity||money<cost)return;

money-=cost;
terrainLevels[selectedTerrain]++;
updateUI();
saveGame();
};

document.getElementById("soldierBtn").onclick=()=>{
if(money<120)return;
money-=120;
troops.push({
type:"Soldier",
x:300,
y:520,
hp:180,
maxHp:180,
damage:18,
speed:28,
cooldown:0
});
};

document.getElementById("knightBtn").onclick=()=>{
if(money<300)return;
money-=300;
troops.push({
type:"Knight",
x:300,
y:520,
hp:500,
maxHp:500,
damage:45,
speed:22,
cooldown:0
});
};

document.getElementById("archerBtn").onclick=()=>{
if(money<180)return;
money-=180;
troops.push({
type:"Archer",
x:300,
y:520,
hp:130,
maxHp:130,
damage:30,
speed:25,
cooldown:800
});
};

function enemyForWave(){
const r=Math.random();
let index=0;

if(wave>=3&&r>.62)index=1;
if(wave>=5&&r>.76)index=2;
if(wave>=8&&r>.88)index=3;
if(wave>=12&&r>.95)index=4;

const base=enemyTypes[index];

return{
type:base.name,
x:1740,
y:475,
path:0,
hp:base.hp*(1+wave*.22),
maxHp:base.hp*(1+wave*.22),
speed:base.speed,
damage:base.damage*(1+wave*.08),
reward:Math.floor(base.reward*(1+wave*.06)),
color:index===0?"#7bc96f":index===1?"#b47b42":index===2?"#aaa":index===3?"#8b6748":"#a33",
slow:1,
poison:0
};
}

function spawnEnemy(){
enemies.push(enemyForWave());
}

function updateEnemies(dt){
for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];

if(e.poison>0){
e.poison-=dt;
e.hp-=dt*.02;
}

const target=roadPoints[Math.min(e.path+1,roadPoints.length-1)];

if(!target){
castleHP-=e.damage*dt/1000;
enemies.splice(i,1);
continue;
}

const dx=target.x-e.x;
const dy=target.y-e.y;
const d=Math.hypot(dx,dy);

if(d<8){
e.path++;

if(e.path>=roadPoints.length-1){
castleHP-=e.damage;
enemies.splice(i,1);
continue;
}
}else{
const speed=e.speed*e.slow;
e.x+=dx/d*speed*dt/1000;
e.y+=dy/d*speed*dt/1000;
}

if(e.hp<=0){
money+=e.reward;
kills++;
enemies.splice(i,1);
}
}
}

function updateTowers(dt){
for(const t of towers){
t.cooldown-=dt;
if(t.cooldown>0)continue;

const s=towerStats(t);

let target=null;
let best=-Infinity;

for(const e of enemies){
const d=dist(t,e);
if(d<=s.range&&e.path>best){
best=e.path;
target=e;
}
}

if(!target)continue;

t.cooldown=s.rate;

const p={
x:t.x,
y:t.y,
target,
damage:s.damage,
speed:650,
splash:["Splash","Mortar","Catapult","Meteor"].includes(t.type.name)?45:0,
slow:["Slow","Freeze","Ice"].includes(t.type.name)?0.55:1,
poison:t.type.name==="Poison"?1000:0,
color:t.type.color
};

projectiles.push(p);
}
}

function updateProjectiles(dt){
for(let i=projectiles.length-1;i>=0;i--){
const p=projectiles[i];

if(!p.target||!enemies.includes(p.target)){
projectiles.splice(i,1);
continue;
}

const dx=p.target.x-p.x;
const dy=p.target.y-p.y;
const d=Math.hypot(dx,dy);

if(d<12){
hitEnemy(p);
projectiles.splice(i,1);
continue;
}

p.x+=dx/d*p.speed*dt/1000;
p.y+=dy/d*p.speed*dt/1000;
}
}

function hitEnemy(p){
const e=p.target;
e.hp-=p.damage;

if(p.slow)e.slow=Math.min(e.slow,p.slow);
if(p.poison)e.poison=p.poison;

const owner=towers.find(t=>Math.abs(t.x-p.x)<2&&Math.abs(t.y-p.y)<2);
if(owner)owner.kills++;

for(const other of enemies){
if(p.splash&&other!==e&&dist(e,other)<p.splash){
other.hp-=p.damage*.35;
}
}

for(let i=0;i<5;i++){
particles.push({
x:e.x+(Math.random()-.5)*15,
y:e.y+(Math.random()-.5)*15,
life:1,
color:p.color
});
}
}

function updateTroops(dt){
for(let i=troops.length-1;i>=0;i--){
const t=troops[i];

if(t.hp<=0){
troops.splice(i,1);
continue;
}

let target=null;
let best=Infinity;

for(const e of enemies){
const d=dist(t,e);
if(d<best){
best=d;
target=e;
}
}

if(!target)continue;

if(best>25){
const dx=target.x-t.x;
const dy=target.y-t.y;
const d=Math.hypot(dx,dy);
t.x+=dx/d*t.speed*dt/1000;
t.y+=dy/d*t.speed*dt/1000;
}else{
t.cooldown-=dt;
if(t.cooldown<=0){
target.hp-=t.damage;
t.cooldown=t.type==="Archer"?900:700;
}
}
}
}

function updateParticles(dt){
for(let i=particles.length-1;i>=0;i--){
particles[i].life-=dt/500;
if(particles[i].life<=0)particles.splice(i,1);
}
}

function updateWave(dt){
if(waveActive){
spawnTimer-=dt;

if(spawnTimer<=0){
const count=5+wave*2;

if(nextEnemy<count){
spawnEnemy();
nextEnemy++;
spawnTimer=Math.max(350,900-wave*25);
}else if(enemies.length===0){
waveActive=false;
wave++;
waveTimer=3000;
nextEnemy=0;
money+=100+wave*20;
updateUI();
saveGame();
}
}
}else{
waveTimer-=dt;

if(waveTimer<=0){
waveActive=true;
nextEnemy=0;
spawnTimer=0;
}
}
}

function gameLoop(now){
const dt=Math.min(40,now-lastTime);
lastTime=now;

if(!paused&&!gameOver){
gameTime+=dt;
updateWave(dt);
updateEnemies(dt/1000*1000);
updateTowers(dt);
updateProjectiles(dt);
updateTroops(dt);
updateParticles(dt);

if(castleHP<=0){
castleHP=0;
gameOver=true;
showGameOver();
}

updateUI();
}

draw();
requestAnimationFrame(gameLoop);
}

function showGameOver(){
document.getElementById("overlay").style.display="flex";
document.getElementById("overlayTitle").textContent="KINGDOM LOST";
document.getElementById("overlayText").textContent=
"You reached wave "+wave+" with "+kills+" kills.";
}

function resetGame(){
money=5000;
wave=1;
kills=0;
castleHP=1000;
paused=false;
gameOver=false;
selectedTower=null;
selectedBuild=null;
selectedTerrain=null;
roadMode=false;
towers=[];
enemies=[];
projectiles=[];
particles=[];
troops=[];
terrainTiles=[];
roads=[];
terrainLevels={
forest:1,hills:1,crystal:1,mountain:1,
swamp:1,ice:1,desert:1,plains:1
};
waveTimer=0;
waveActive=false;
nextEnemy=0;

camera={
x:0,
y:0,
zoom:.72
};

document.getElementById("overlay").style.display="none";
document.getElementById("pauseBtn").textContent="PAUSE";
updateUI();
saveGame();
}

function saveGame(){
const data={
money,
wave,
kills,
castleHP,
towers:towers.map(t=>({
x:t.x,
y:t.y,
type:t.type.name,
level:t.level,
kills:t.kills
})),
terrainTiles,
roads,
terrainLevels
};

try{
localStorage.setItem("kingdomWarSave",JSON.stringify(data));
}catch(e){}
}

function loadGame(){
try{
const raw=localStorage.getItem("kingdomWarSave");
if(!raw)return;

const data=JSON.parse(raw);

money=data.money??5000;
wave=data.wave??1;
kills=data.kills??0;
castleHP=data.castleHP??1000;
terrainTiles=data.terrainTiles||[];
roads=data.roads||[];
terrainLevels=data.terrainLevels||{
forest:1,hills:1,crystal:1,mountain:1,
swamp:1,ice:1,desert:1,plains:1
};

towers=[];

for(const t of data.towers||[]){
const type=towerTypes.find(x=>x.name===t.type);
if(type){
towers.push({
x:t.x,
y:t.y,
type,
level:t.level||1,
cooldown:0,
kills:t.kills||0
});
}
}

selectedTower=null;
enemies=[];
projectiles=[];
troops=[];
particles=[];
waveActive=false;
waveTimer=2000;
nextEnemy=0;

updateUI();
}catch(e){}
}

document.getElementById("saveBtn").onclick=saveGame;
document.getElementById("loadBtn").onclick=loadGame;

document.getElementById("newBtn").onclick=()=>{
if(confirm("Start a completely new kingdom?")){
resetGame();
}
};

document.getElementById("retryBtn").onclick=()=>{
resetGame();
};

document.getElementById("homeBtn").onclick=()=>{
window.location.href="index.html";
};

document.addEventListener("keydown",e=>{
if(e.key.toLowerCase()==="r"){
window.__rDown=(window.__rDown||"")+"r";

if(window.__rDown.length>3){
window.__rDown=window.__rDown.slice(-3);
}

if(window.__rDown==="rrr"){
window.location.href="index.html";
}
}
});

setInterval(saveGame,5000);

loadGame();
updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
