<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal | Flashcard.com</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050607;color:#d7f7e7;font-family:Consolas,"Courier New",monospace}
body{display:flex;align-items:center;justify-content:center;padding:18px}.terminal{width:min(950px,100%);height:min(680px,94vh);background:#090d0e;border:1px solid #315344;border-radius:12px;overflow:hidden;box-shadow:0 24px 80px #000;display:flex;flex-direction:column}
.top{height:42px;background:#151c1b;border-bottom:1px solid #294137;display:flex;align-items:center;padding:0 14px;gap:8px;color:#9bb7a9;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#e26b62}.dot:nth-child(2){background:#e5bd58}.dot:nth-child(3){background:#69c779}
.top span:last-child{margin-left:10px}.screen{padding:22px;overflow:auto;flex:1;font-size:14px;line-height:1.7}
.line{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#668b78}.prompt{display:flex;gap:10px;align-items:center;margin-top:8px}.prompt b{color:#76e0a9}.prompt input{flex:1;background:transparent;border:0;outline:0;color:#e6fff0;font:inherit;min-width:0}
.back{position:fixed;right:20px;top:14px;color:#789989;text-decoration:none;font-size:12px}
</style></head><body>
<a class="back" href="index.html">ESC · HOME</a>
<section class="terminal"><div class="top"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>FLASHCARD.COM — TERMINAL</span></div>
<div class="screen" id="screen"><div class="line">FLASHCARD.COM SYSTEM TERMINAL [Version 11.0.67]</div><div class="line muted">(c) Flashcard.com. All rights reserved.</div><div class="line">&nbsp;</div><div class="line">Type commands below. This is a visual sandbox; commands are not executed on your device.</div><div class="line muted">Try: help, dir, whoami, date, clear</div><div id="history"></div><div class="prompt"><b>F:\&gt;</b><input id="command" autocomplete="off" spellcheck="false" autofocus aria-label="Terminal command"></div></div></section>
<script>
const input=document.getElementById("command"),history=document.getElementById("history"),screen=document.getElementById("screen");
function line(t,cls=""){const d=document.createElement("div");d.className="line "+cls;d.textContent=t;history.append(d);screen.scrollTop=screen.scrollHeight}
input.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const v=input.value;input.value="";line("F:\\> "+v);const cmd=v.trim();if(cmd==="GenderBender"){location.href="https://makkapakka-7788.github.io/makkapakka/extra-games.html?v=20261120-direct";return}if(!cmd)return;const c=cmd.toLowerCase();if(c==="clear"){history.innerHTML="";return}if(c==="help")line("Available commands: help, dir, whoami, date, ver, echo [text], clear","muted");else if(c==="dir")line("Directory of F:\\SYSTEM\nAPPS   GAMES   SYSTEM   USERS","muted");else if(c==="whoami")line("FLASHCARD\\USER","muted");else if(c==="date")line(new Date().toString(),"muted");else if(c==="ver")line("Flashcard.com Terminal 11.0.67","muted");else if(c.startsWith("echo "))line(cmd.slice(5),"muted");else line("'"+cmd+"' is not recognised as an internal or external command.","muted")});
</script></body></html>
