<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extra Access | Flashcard.com</title>
<link rel="icon" href="favicon.png">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;padding:22px;background:#f3f7fc;color:#1d2a3a;font-family:Arial,Helvetica,sans-serif}
.panel{width:min(420px,100%);padding:34px;background:#fff;border:1px solid #dce5ef;border-top:5px solid #1769e0;border-radius:14px;text-align:center;box-shadow:0 8px 30px rgba(30,60,90,.12)}
h1{margin:0 0 12px;color:#1769e0;font-size:25px}
p{color:#718096;line-height:1.5}
input{width:100%;margin:16px 0 10px;padding:14px;border:1px solid #ccd7e3;border-radius:8px;font:16px Arial;color:#1d2a3a}
input:focus{outline:2px solid #1769e0}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:hover{background:#0e55bd}
#message{min-height:20px;color:#c53030;font-size:13px}
</style>
</head>
<body>
<form class="panel" id="gate">
<h1>EXTRA ACCESS</h1>
<p>Enter password for extra access.</p>
<input id="password" type="password" placeholder="Enter password" autocomplete="off" required autofocus>
<div id="message" aria-live="polite"></div>
<button id="continue" type="submit">CONTINUE</button>
</form>
<script>
const saltText="71XAXhevouhLnBRipYpEaw==";
const verifierText="HHDNOE7MIJYbD9IBMeSygqgF7yO7ZdjHJzosVL8IIFs=";
const decode=v=>Uint8Array.from(atob(v),c=>c.charCodeAt(0));
async function verify(value){
 const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(value),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:decode(saltText),iterations:600000},key,256);
 const actual=new Uint8Array(bits),expected=decode(verifierText);
 if(actual.length!==expected.length)return false;
 let diff=0;for(let i=0;i<actual.length;i++)diff|=actual[i]^expected[i];
 return diff===0;
}
document.getElementById("gate").addEventListener("submit",async e=>{
 e.preventDefault();
 const input=document.getElementById("password"),button=document.getElementById("continue"),message=document.getElementById("message");
 button.disabled=true;message.textContent="Checking…";
 try{
  if(await verify(input.value)){location.replace("index.html?embedded=1&bypass=1");}
  else{message.textContent="Incorrect password. Try again.";input.select();}
 }catch(error){message.textContent="Password check unavailable. Please try again.";}
 finally{button.disabled=false;}
});
</script>
</body>
</html>
