<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Number Match</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#00ff66}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:"Courier New",monospace}
#terminal{width:min(900px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.number{min-width:0;text-align:center;font-size:clamp(34px,8vw,82px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;text-shadow:0 0 12px #00ff6655;font-variant-numeric:tabular-nums}
.number.frozen{color:#00a843;text-shadow:none}
@media(max-width:520px){body{padding:12px}#terminal{gap:8px}.number{font-size:clamp(26px,8vw,48px)}}
</style>
</head>
<body>
<main id="terminal" aria-live="off"></main>
<script>
(() => {
const terminal = document.getElementById('terminal');
let level = 1;
let numbers = [];
let timer = null;
let retryTimer = null;
let active = false;

function render() {
  terminal.style.gridTemplateColumns = 'repeat(' + Math.min(3, numbers.length) + ', minmax(0, 1fr))';
  terminal.innerHTML = numbers.map(n => '<div class="number' + (n.frozen ? ' frozen' : '') + '">' + n.value.toLocaleString() + '</div>').join('');
}

function finishRound() {
  active = false;
  clearInterval(timer);
  timer = null;
  const match = numbers.every(n => n.value === numbers[0].value);
  if (match) level++;
  retryTimer = setTimeout(startRound, 0);
}

function tick() {
  if (!active) return;
  for (const n of numbers) {
    if (!n.frozen) {
      if (Math.random() < 0.5) n.value++;
      else n.frozen = true;
    }
  }
  render();
  if (numbers.every(n => n.frozen)) finishRound();
}

function startRound() {
  clearInterval(timer);
  clearTimeout(retryTimer);
  numbers = Array.from({length: level + 2}, () => ({value:1, frozen:false}));
  active = true;
  render();
  timer = setInterval(tick, 10);
}

startRound();
})();
</script>
</body>
</html>
