<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>FlashOS</title>
<style>
:root{color-scheme:dark;--text:#f4f6fb;--muted:#9ca7bb;--panel:rgba(18,22,32,.94);--panel2:#202636;--line:#ffffff18;--accent:#8795ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:var(--text);background:#090b10;font-size:14px}button,input,textarea,select{font:inherit}button{color:inherit;background:#ffffff0c;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{background:#ffffff19}input,textarea,select{color:var(--text);background:#0c1019;border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}textarea{resize:vertical}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wallpaper{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 18% 18%,#303e7d 0,transparent 35%),radial-gradient(ellipse at 78% 30%,#512e70 0,transparent 34%),radial-gradient(ellipse at 50% 100%,#142f49 0,transparent 45%),linear-gradient(135deg,#080a10,#101522 55%,#080a10)}.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff04,transparent 40%,#00000020)}
.desktop{height:100dvh;padding:28px 28px 86px;position:relative}.desktop-head{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;letter-spacing:-.04em;font-size:22px}.brand span{color:var(--accent)}.date{color:#d8dced;font-size:12px;text-align:right}.welcome{position:absolute;left:50%;top:20%;transform:translateX(-50%);text-align:center;width:min(560px,90vw);pointer-events:none}.welcome h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.055em;margin:0 0 8px}.welcome p{color:#d0d5e2;margin:0}.desktop-icons{position:absolute;top:100px;left:24px;display:grid;grid-template-columns:repeat(2,78px);gap:12px}.desktop-app{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;padding:9px 5px;font-size:12px;text-shadow:0 1px 4px #000}.desktop-app:hover{background:#ffffff16}.app-icon{width:48px;height:48px;border:1px solid #ffffff26;border-radius:15px;background:linear-gradient(145deg,#ffffff24,#ffffff08);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 24px #0003}.taskbar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);height:58px;padding:7px 10px;display:flex;align-items:center;gap:6px;border:1px solid #ffffff20;background:#111520d9;backdrop-filter:blur(24px);border-radius:19px;box-shadow:0 12px 50px #0006;max-width:calc(100vw - 24px);z-index:1000}.taskbar button{width:43px;height:43px;padding:0;border:0;font-size:21px;display:grid;place-items:center}.taskbar .start{background:var(--accent);color:#0a0b12;font-weight:800}.taskbar .divider{height:30px;width:1px;background:#ffffff20;margin:0 3px}.taskbar .active{background:#ffffff24}.taskbar .tray{font-size:11px;color:var(--muted);padding:0 7px;white-space:nowrap}
.window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(650px,calc(100vw - 24px));height:min(470px,calc(100dvh - 115px));min-width:min(300px,calc(100vw - 24px));min-height:230px;display:flex;flex-direction:column;background:var(--panel);border:1px solid #ffffff24;border-radius:16px;box-shadow:0 24px 90px #0008;backdrop-filter:blur(25px);overflow:hidden}.window.maximized{position:fixed!important;inset:12px 12px 83px!important;width:auto!important;height:auto!important;min-width:0!important;min-height:0!important;transform:none!important}.titlebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);cursor:grab;flex-shrink:0}.titlebar:active{cursor:grabbing}.window-title{display:flex;align-items:center;gap:9px;font-weight:650}.window-controls{display:flex;gap:6px}.window-controls button{padding:0;width:27px;height:27px;border:0}.window-controls .close:hover{background:#d9485b}.window-body{padding:17px;overflow:auto;flex:1}.window-body h2{margin:0 0 10px;font-size:22px;letter-spacing:-.035em}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.stack{display:flex;flex-direction:column;gap:10px}.note-area{height:100%;min-height:220px;line-height:1.6}.note-layout{height:100%;display:grid;grid-template-columns:150px 1fr;gap:12px}.note-list{display:flex;flex-direction:column;gap:6px;overflow:auto}.note-list button{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-list button.selected{border-color:var(--accent);background:#8795ff20}.note-main{display:flex;flex-direction:column;gap:9px;min-height:0}.note-main input{font-weight:650}.flashcard{border:1px solid var(--line);background:linear-gradient(145deg,#222a40,#141a28);border-radius:15px;min-height:180px;display:grid;place-items:center;text-align:center;padding:22px;font-size:21px;font-weight:650;cursor:pointer;white-space:pre-wrap}.flashcard small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:12px}.calc{max-width:360px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-display{grid-column:1/-1;text-align:right;font-size:27px;padding:17px;margin-bottom:4px}.calc button{font-size:17px;padding:15px 5px}.calc .equals{background:var(--accent);color:#090b12}.app-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}.app-tile{display:flex;align-items:center;gap:10px;text-align:left;padding:12px}.app-tile .app-icon{flex-shrink:0;width:40px;height:40px;font-size:20px}.file-list{display:flex;flex-direction:column;gap:7px;margin-top:14px}.file-row{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:10px}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.swatch{height:35px;border-radius:8px;margin-bottom:8px}.paint-wrap{height:100%;display:flex;flex-direction:column;gap:10px}.paint-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.paint-tools input[type=color]{width:45px;height:37px;padding:2px}.paint-canvas{width:100%;flex:1;min-height:150px;background:#fff;border-radius:10px;touch-action:none}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#171d2b;border:1px solid var(--line);border-radius:12px;z-index:2000;box-shadow:0 8px 30px #0006}.hidden{display:none!important}
@media(max-width:560px){.desktop{padding:18px 14px 80px}.desktop-icons{left:10px;top:90px;grid-template-columns:repeat(2,68px);gap:7px}.welcome{top:29%;left:56%;width:75%}.welcome h1{font-size:28px}.date{font-size:10px}.taskbar{gap:3px;padding:6px}.taskbar button{width:36px;height:40px}.taskbar .tray{display:none}.window{width:calc(100vw - 16px);height:calc(100dvh - 100px)}.note-layout{grid-template-columns:100px 1fr;gap:7px}.window-body{padding:11px}}

.booting .desktop,.booting .taskbar{visibility:hidden}.splash{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#303e7d 0,transparent 38%),radial-gradient(ellipse at 80% 75%,#512e70 0,transparent 38%),#080a10;transition:opacity .5s,visibility .5s}.splash.done{opacity:0;visibility:hidden;pointer-events:none}.splash-inner{text-align:center;width:min(440px,90vw);padding:30px}.splash-logo{width:88px;height:88px;margin:0 auto 22px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,#8795ff,#bd78ff);color:#080a10;font-size:43px;font-weight:900;box-shadow:0 15px 70px #8795ff55}.splash h1{font-size:38px;letter-spacing:-.06em;margin:0}.splash p{color:#aeb8ce;margin:10px 0 26px}.boot-progress{height:4px;background:#ffffff15;border-radius:9px;overflow:hidden;margin:0 auto 22px;max-width:250px}.boot-progress span{display:block;height:100%;width:0;background:var(--accent);transition:width 1.2s ease}.splash button{background:var(--accent);color:#080a10;border:0;font-weight:800;padding:12px 26px;border-radius:12px}.external-app{display:flex;flex-direction:column;gap:10px}.external-app iframe{width:100%;height:100%;min-height:300px;border:1px solid var(--line);border-radius:10px;background:#fff}.games-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.game-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);border:1px solid var(--line);background:#ffffff08;border-radius:12px;padding:14px}.game-link:hover{background:#ffffff16}
.passcode-overlay{position:fixed;inset:0;z-index:6000;display:grid;place-items:center;padding:20px;background:#03050bdc;backdrop-filter:blur(18px)}.passcode-card{width:min(390px,100%);padding:28px;border:1px solid #ffffff26;border-radius:20px;background:#111725;box-shadow:0 25px 100px #000b}.passcode-card h2{margin:0 0 8px;font-size:24px}.passcode-logo{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:#8795ff22;font-size:25px;margin-bottom:17px}.passcode-card form{display:flex;flex-direction:column;gap:10px}.passcode-card .row{justify-content:flex-end}.passcode-card .gate-submit{background:var(--accent);color:#090b12;font-weight:800}.gate-error{color:#ff8795;min-height:18px;margin:0;font-size:12px}</style>
</head>
<body class="booting">
<div class="splash" id="splash"><div class="splash-inner"><div class="splash-logo">F</div><h1>FlashOS</h1><p>Your browser. Your apps. Your world.</p><div class="boot-progress"><span id="bootProgress"></span></div><button id="bootButton">Start FlashOS</button></div></div>
<div class="wallpaper" id="wallpaper"></div>
<main class="desktop" id="desktop">
<header class="desktop-head"><div class="brand">Flash<span>OS</span></div><div class="date"><div id="clock">--:--</div><div id="today">Loading date</div></div></header>
<div class="desktop-icons" id="desktopIcons"></div>
<section class="welcome"><h1 id="greeting">Welcome to FlashOS</h1><p>Your space. Your apps. Your ideas.</p></section>
</main>
<nav class="taskbar" id="taskbar" aria-label="Taskbar"><button class="start" title="App launcher" data-app="launcher">✣</button><span class="divider"></span><button title="Notes" data-app="notes">📝</button><button title="Flashcards" data-app="flashcards">📚</button><button title="Calculator" data-app="calculator">🧮</button><button title="Files" data-app="files">📁</button><button title="Paint" data-app="paint">🎨</button><button title="Calendar" data-app="calendar">📅</button><span class="divider"></span><div class="tray" id="tray">FlashOS · Ready</div></nav>
<script>
const $=s=>document.querySelector(s);
const icons={flashaccount:"👤",notes:"📝",flashcards:"📚",calculator:"🧮",files:"📁",paint:"🎨",calendar:"📅",settings:"⚙️",launcher:"✣",music:"🎵",gamehub:"🎮",webflash:"🌐"};
const labels={flashaccount:"FlashAccount",notes:"Notes",flashcards:"Flashcards",calculator:"Calculator",files:"Files",paint:"Paint",calendar:"Calendar",settings:"Settings",launcher:"All apps",music:"Music",gamehub:"Game Hub",webflash:"Flashcard.com"};
const apps=["flashaccount","notes","flashcards","webflash","calculator","files","paint","calendar","settings","music"];
const safeRead=(key,fallback)=>{try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}catch{return fallback}};
const safeWrite=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}};
let notes=safeRead("flashos.notes",[{id:1,title:"Welcome to FlashOS",body:"This is your notes app. Create a note and start writing! "}]);
let decks=safeRead("flashos.decks",[{name:"My first deck",cards:[{q:"What can FlashOS do?",a:"Run your everyday apps in the browser."},{q:"Where are notes saved?",a:"In this browser, on this device."}]}]);
let files=safeRead("flashos.files",[{name:"Documents",type:"folder"},{name:"Pictures",type:"folder"},{name:"Welcome.txt",type:"file"}]);
let preferences=safeRead("flashos.preferences",{accent:"#8795ff",wallpaper:0});
let z=10,activeNote=notes[0]?.id||null,windowCount=0,flashIndex=0,showAnswer=false,calcExpression="";const openWindows=new Map();
function persist(){safeWrite("flashos.notes",notes);safeWrite("flashos.decks",decks);safeWrite("flashos.files",files)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderDesktop(){const host=$("#desktopIcons");host.innerHTML="";["flashaccount","notes","flashcards","webflash","calculator","files","paint","calendar","settings","launcher"].forEach(id=>{const b=document.createElement("button");b.className="desktop-app";b.innerHTML='<span class="app-icon">'+icons[id]+'</span><span>'+labels[id]+'</span>';b.onclick=()=>openApp(id);host.append(b)});document.documentElement.style.setProperty("--accent",preferences.accent);if(preferences.wallpaper===1)$("#wallpaper").style.background="radial-gradient(ellipse at 20% 20%,#155e63,transparent 40%),radial-gradient(ellipse at 80% 60%,#23503b,transparent 42%),#080d10";else if(preferences.wallpaper===2)$("#wallpaper").style.background="radial-gradient(ellipse at 25% 15%,#79394e,transparent 40%),radial-gradient(ellipse at 80% 70%,#57418a,transparent 42%),#100910";else $("#wallpaper").style.background=""}
let secretTyped="",secretLast=0,gateOpen=false;
function openGameGate(){if(gateOpen)return;gateOpen=true;const modal=document.createElement("div");modal.className="passcode-overlay";modal.innerHTML='<div class="passcode-card"><div class="passcode-logo">🔒</div><h2>Restricted Access</h2><p class="muted">Enter the passcode to open the Game Hub.</p><form id="gameGateForm"><input id="gameGateInput" type="password" autocomplete="off" placeholder="Passcode" aria-label="Passcode" required><p id="gameGateError" class="gate-error"></p><div class="row"><button type="button" id="gameGateCancel">Cancel</button><button type="submit" class="gate-submit">Unlock</button></div></form></div>';document.body.append(modal);const input=modal.querySelector("#gameGateInput");input.focus();modal.querySelector("#gameGateCancel").onclick=()=>{modal.remove();gateOpen=false;secretTyped=""};modal.querySelector("#gameGateForm").onsubmit=e=>{e.preventDefault();if(input.value==="#makkapakka#"){modal.remove();gateOpen=false;secretTyped="";openApp("gamehub")}else{modal.querySelector("#gameGateError").textContent="Incorrect passcode. Try again.";input.value="";input.focus()}}}
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.key.length!==1)return;const now=Date.now();if(now-secretLast>1800)secretTyped="";secretLast=now;secretTyped+=e.key.toLowerCase();if(secretTyped.length>3)secretTyped=secretTyped.slice(-3);if(secretTyped==="uuu"){secretTyped="";openGameGate()}});
function startFlashOS(){document.body.classList.remove("booting");const s=$("#splash");s.classList.add("done");setTimeout(()=>s.remove(),550);safeWrite("flashos.booted",true)}
function updateClock(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});$("#today").textContent=d.toLocaleDateString([], {weekday:"short",day:"numeric",month:"short"});$("#greeting").textContent=(d.getHours()<12?"Good morning":d.getHours()<18?"Good afternoon":"Good evening")}
function toast(msg){const old=$(".toast");if(old)old.remove();const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2200)}
function openApp(id){if(openWindows.has(id)){const w=openWindows.get(id);w.classList.remove("hidden");w.style.zIndex=++z;return}const win=document.createElement("section");win.className="window maximized";win.dataset.app=id;win.style.zIndex=++z;win.style.left=(window.innerWidth/2+(windowCount%5)*18-36)+"px";win.style.top=(window.innerHeight/2+(windowCount%5)*14-28)+"px";windowCount++;win.innerHTML='<header class="titlebar"><div class="window-title"><span>'+icons[id]+'</span><span>'+labels[id]+'</span></div><div class="window-controls"><button data-min title="Minimise">−</button><button data-max title="Maximise">□</button><button data-close class="close" title="Close">×</button></div></header><div class="window-body">'+appContent(id)+'</div>';$("#desktop").append(win);openWindows.set(id,win);win.style.transform="none";win.querySelector("[data-close]").onclick=()=>{win.remove();openWindows.delete(id)};win.querySelector("[data-min]").onclick=()=>win.classList.add("hidden");win.querySelector("[data-max]").onclick=()=>win.classList.toggle("maximized");win.addEventListener("pointerdown",()=>{win.style.zIndex=++z;document.querySelectorAll(".taskbar [data-app]").forEach(b=>b.classList.toggle("active",b.dataset.app===id))});makeDraggable(win);wireApp(id,win);document.querySelectorAll(".taskbar [data-app]").forEach(b=>b.classList.toggle("active",b.dataset.app===id))}
function makeDraggable(win){const bar=win.querySelector(".titlebar");let sx=0,sy=0,ox=0,oy=0,drag=false;bar.addEventListener("pointerdown",e=>{if(e.target.closest("button")||win.classList.contains("maximized"))return;drag=true;bar.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;const r=win.getBoundingClientRect();ox=r.left+ r.width/2;oy=r.top+r.height/2;win.style.transform="translate(-50%,-50%)";});bar.addEventListener("pointermove",e=>{if(!drag)return;const x=Math.max(win.offsetWidth/2,Math.min(innerWidth-win.offsetWidth/2,ox+e.clientX-sx));const y=Math.max(35,Math.min(innerHeight-80,oy+e.clientY-sy));win.style.left=x+"px";win.style.top=y+"px"});bar.addEventListener("pointerup",()=>drag=false);bar.addEventListener("pointercancel",()=>drag=false)}
function appContent(id){if(id==="launcher")return '<h2>All apps</h2><p class="muted">Everything you need, in one place.</p><div class="app-grid">'+apps.map(a=>'<button class="app-tile" data-launch="'+a+'"><span class="app-icon">'+icons[a]+'</span><span>'+labels[a]+'</span></button>').join("")+'</div>';if(id==="flashaccount")return '<div class="account-wrap"><h2>FlashAccount</h2><p class="muted">Sign in with your Google account to use your Flashcard.com account.</p><div id="flashAccountStatus" class="account-status">Checking account status…</div><div class="account-actions"><button id="flashAccountSignIn">Continue with Google</button><button id="flashAccountSignOut" class="hidden">Sign out</button></div><p class="muted">Uses the existing Flashcard.com Firebase authentication.</p></div>';if(id==="notes")return notesContent();if(id==="flashcards")return flashcardsContent();if(id==="webflash")return '<div class="external-app"><h2>Flashcard.com</h2><p class="muted">Your existing flashcard website, opened inside FlashOS.</p><iframe src="../flashcard.html" title="Flashcard.com"></iframe><p><a href="../flashcard.html" target="_blank" rel="noopener">Open Flashcard.com in a new tab</a></p></div>';if(id==="gamehub")return '<h2>Game Hub</h2><p class="muted">Choose a game to launch fullscreen.</p><div class="games-list"><a class="game-link" href="../NEW.f1/" target="_blank" rel="noopener">🏎️ PolyTrack</a><a class="game-link" href="../ironcrown/" target="_blank" rel="noopener">♟️ Ironcrown</a><a class="game-link" href="../dr-doom/" target="_blank" rel="noopener">🕹️ Doom</a><a class="game-link" href="../Clicker/" target="_blank" rel="noopener">✨ Antimatter Dimensions</a><a class="game-link" href="../pacman.html" target="_blank" rel="noopener">👻 Pac-Man</a></div>';if(id==="calculator")return '<div class="calc"><input class="calc-display" id="calcDisplay" value="" placeholder="0" aria-label="Calculator display" readonly>'+["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="].map(k=>'<button data-key="'+k+'" class="'+(k==="="?"equals":"")+'">'+k+'</button>').join("")+'</div><p class="muted" style="text-align:center">Keyboard input supported</p>';if(id==="files")return '<h2>My files</h2><p class="muted">A simple virtual file list saved in this browser.</p><div class="row"><input id="newFile" placeholder="New file or folder name"><button id="addFile">Create</button></div><div class="file-list" id="fileList"></div><p class="muted">This is FlashOS virtual storage, not your computer’s full file system.</p>';if(id==="paint")return '<div class="paint-wrap"><div class="paint-tools"><label>Colour <input id="paintColor" type="color" value="#202020"></label><button id="paintClear">Clear</button><button id="paintSave">Save drawing</button></div><canvas class="paint-canvas" id="paintCanvas"></canvas></div>';if(id==="calendar")return '<h2 id="calendarMonth"></h2><div id="calendarGrid" class="app-grid"></div><p class="muted">Your local calendar view. Events can be added in a future update.</p>';if(id==="settings")return '<h2>Personalise FlashOS</h2><p class="muted">Your preferences save in this browser.</p><h3>Accent colour</h3><div class="settings-grid">'+["#8795ff","#50d6b0","#ffad66","#ff78a8","#c18aff"].map(c=>'<button data-accent="'+c+'"><div class="swatch" style="background:'+c+'"></div>'+c+'</button>').join("")+'</div><h3>Wallpaper</h3><div class="row"><button data-wall="0">Midnight</button><button data-wall="1">Forest</button><button data-wall="2">Dusk</button></div><p class="muted">Reset local data only if you really want to erase your saved notes and decks.</p><button id="resetData">Reset FlashOS data</button>';if(id==="music")return '<h2>Music</h2><p class="muted">Add your own audio files using the picker below. Playback is local to this browser session.</p><input id="audioPick" type="file" accept="audio/*"><audio id="audioPlayer" controls style="width:100%;margin-top:15px"></audio>';return '<p>App not found.</p>'}
function notesContent(){return '<div class="note-layout"><div><button id="newNote" style="width:100%">＋ New note</button><div class="note-list" id="noteList" style="margin-top:10px"></div></div><div class="note-main" id="noteMain"></div></div>'}
function flashcardsContent(){return '<div class="row" style="justify-content:space-between"><div><h2>Flashcards</h2><p class="muted">Create decks and practise remembering.</p></div><button id="newDeck">＋ New deck</button></div><div class="stack"><select id="deckSelect">'+decks.map((d,i)=>'<option value="'+i+'">'+escapeHTML(d.name)+'</option>').join("")+'</select><div class="flashcard" id="flashCard" tabindex="0" role="button"></div><div class="row" style="justify-content:space-between"><button id="prevCard">← Previous</button><span id="cardCount" class="muted"></span><button id="nextCard">Next →</button></div><div class="row"><input id="cardQ" placeholder="Question"><input id="cardA" placeholder="Answer"><button id="addCard">Add card</button></div><button id="deleteDeck">Delete current deck</button></div>'}
function renderNotes(win){const list=win.querySelector("#noteList"),main=win.querySelector("#noteMain");list.innerHTML=notes.map(n=>'<button data-note="'+n.id+'" class="'+(n.id===activeNote?"selected":"")+'">'+escapeHTML(n.title||"Untitled note")+'</button>').join("");list.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{activeNote=Number(b.dataset.note);renderNotes(win)});const n=notes.find(n=>n.id===activeNote);if(!n){main.innerHTML='<p class="empty">Create a note to get started.</p>';return}main.innerHTML='<input id="noteTitle" value="'+escapeHTML(n.title)+'" aria-label="Note title"><textarea class="note-area" id="noteBody" aria-label="Note content">'+escapeHTML(n.body)+'</textarea><div class="row"><span class="muted" id="saveStatus">Saved in this browser</span><button id="deleteNote" style="margin-left:auto">Delete</button></div>';const save=()=>{n.title=main.querySelector("#noteTitle").value;n.body=main.querySelector("#noteBody").value;safeWrite("flashos.notes",notes);list.querySelector('[data-note="'+n.id+'"]').textContent=n.title||"Untitled note";main.querySelector("#saveStatus").textContent="Saved";};main.querySelector("#noteTitle").oninput=save;main.querySelector("#noteBody").oninput=save;main.querySelector("#deleteNote").onclick=()=>{notes=notes.filter(x=>x.id!==n.id);activeNote=notes[0]?.id||null;safeWrite("flashos.notes",notes);renderNotes(win)}}
function renderFlash(win){const deck=decks[Number(win.querySelector("#deckSelect").value)]||decks[0],card=deck?.cards[flashIndex];win.querySelector("#flashCard").innerHTML=card?escapeHTML(showAnswer?card.a:card.q)+'<small>Click card to '+(showAnswer?"see question":"reveal answer")+'</small>':'No cards yet — add one below.';win.querySelector("#cardCount").textContent=deck?.cards.length?((flashIndex%deck.cards.length)+1)+" / "+deck.cards.length:"0 cards"}
function wireApp(id,win){const q=s=>win.querySelector(s);if(id==="flashaccount"){const status=q("#flashAccountStatus"),signIn=q("#flashAccountSignIn"),signOut=q("#flashAccountSignOut");const paintStatus=user=>{if(user){status.innerHTML="<strong>Signed in</strong><br>"+escapeHTML(user.displayName||"Google user")+"<br><span class=\"muted\">"+escapeHTML(user.email||"")+"</span>";signIn.classList.add("hidden");signOut.classList.remove("hidden")}else{status.textContent="You are signed out.";signIn.classList.remove("hidden");signOut.classList.add("hidden")}};paintStatus(window.flashAccountUser||null);signIn.onclick=async()=>{if(!window.FlashAccount){status.textContent="FlashAccount is still loading. Try again in a moment.";return}signIn.disabled=true;try{await window.FlashAccount.signInWithGoogle()}catch(e){status.textContent="Could not sign in. Check the browser console."}finally{signIn.disabled=false}};signOut.onclick=async()=>{if(!window.FlashAccount)return;signOut.disabled=true;try{await window.FlashAccount.signOut()}catch(e){status.textContent="Could not sign out."}finally{signOut.disabled=false}};window.addEventListener("flashaccount-auth",e=>paintStatus(e.detail));return}if(id==="launcher"){win.querySelectorAll("[data-launch]").forEach(b=>b.onclick=()=>openApp(b.dataset.launch));return}if(id==="notes"){q("#newNote").onclick=()=>{const n={id:Date.now(),title:"New note",body:""};notes.unshift(n);activeNote=n.id;safeWrite("flashos.notes",notes);renderNotes(win)};renderNotes(win);return}if(id==="flashcards"){const refreshSelect=()=>{q("#deckSelect").innerHTML=decks.map((d,i)=>'<option value="'+i+'">'+escapeHTML(d.name)+'</option>').join("");q("#deckSelect").value=String(Math.max(0,Math.min(Number(q("#deckSelect").value)||0,decks.length-1)))};q("#deckSelect").onchange=()=>{flashIndex=0;showAnswer=false;renderFlash(win)};q("#flashCard").onclick=()=>{showAnswer=!showAnswer;renderFlash(win)};q("#flashCard").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();q("#flashCard").click()}};q("#prevCard").onclick=()=>{const d=decks[Number(q("#deckSelect").value)];if(d?.cards.length){flashIndex=(flashIndex-1+d.cards.length)%d.cards.length;showAnswer=false;renderFlash(win)}};q("#nextCard").onclick=()=>{const d=decks[Number(q("#deckSelect").value)];if(d?.cards.length){flashIndex=(flashIndex+1)%d.cards.length;showAnswer=false;renderFlash(win)}};q("#addCard").onclick=()=>{const d=decks[Number(q("#deckSelect").value)];if(!d)return;const question=q("#cardQ").value.trim(),answer=q("#cardA").value.trim();if(!question||!answer){toast("Enter a question and answer first");return}d.cards.push({q:question,a:answer});q("#cardQ").value="";q("#cardA").value="";flashIndex=d.cards.length-1;showAnswer=false;safeWrite("flashos.decks",decks);renderFlash(win)};q("#newDeck").onclick=()=>{const name=prompt("Name your new flashcard deck:");if(name?.trim()){decks.push({name:name.trim(),cards:[]});safeWrite("flashos.decks",decks);refreshSelect();q("#deckSelect").value=String(decks.length-1);flashIndex=0;showAnswer=false;renderFlash(win)}};q("#deleteDeck").onclick=()=>{if(decks.length===1){toast("Keep at least one deck");return}if(confirm("Delete this deck?")){decks.splice(Number(q("#deckSelect").value),1);safeWrite("flashos.decks",decks);refreshSelect();flashIndex=0;renderFlash(win)}};refreshSelect();renderFlash(win);return}
if(id==="calculator"){const display=q("#calcDisplay");function key(k){if(k==="C"){calcExpression="";display.value="";return}if(k==="⌫"){calcExpression=calcExpression.slice(0,-1);display.value=calcExpression;return}if(k==="="){try{let expr=calcExpression.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100");if(!expr||!/^[0-9+*/().\s-]+$/.test(expr))throw Error();const result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw Error();calcExpression=String(Number(result.toPrecision(12)));display.value=calcExpression}catch{display.value="Error";calcExpression=""}return}if(k==="±"){if(calcExpression)calcExpression=calcExpression.startsWith("-")?calcExpression.slice(1):"-"+calcExpression;display.value=calcExpression;return}calcExpression+=k;display.value=calcExpression}win.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>key(b.dataset.key));win.addEventListener("keydown",e=>{if(/^[0-9.+*/()-]$/.test(e.key)){key(e.key);e.stopPropagation()}else if(e.key==="Enter"){key("=");e.stopPropagation()}else if(e.key==="Backspace"){key("⌫");e.stopPropagation()}});return}
if(id==="files"){const render=()=>{q("#fileList").innerHTML=files.map((f,i)=>'<div class="file-row"><span>'+ (f.type==="folder"?"📁 ":"📄 ")+escapeHTML(f.name)+'</span><button data-remove="'+i+'">Delete</button></div>').join("")||'<p class="empty">No files yet</p>';q("#fileList").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{files.splice(Number(b.dataset.remove),1);safeWrite("flashos.files",files);render()})};q("#addFile").onclick=()=>{const name=q("#newFile").value.trim();if(!name)return;files.push({name,type:name.includes(".")?"file":"folder"});q("#newFile").value="";safeWrite("flashos.files",files);render()};q("#newFile").onkeydown=e=>{if(e.key==="Enter")q("#addFile").click()};render();return}
if(id==="paint"){const c=q("#paintCanvas"),ctx=c.getContext("2d");function resize(){const r=c.getBoundingClientRect();const old=document.createElement("canvas");old.width=c.width;old.height=c.height;old.getContext("2d").drawImage(c,0,0);c.width=Math.max(1,r.width*devicePixelRatio);c.height=Math.max(1,r.height*devicePixelRatio);ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);if(old.width&&old.height)ctx.drawImage(old,0,0,c.width,c.height);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=3*devicePixelRatio}setTimeout(resize,30);let drawing=false;function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*devicePixelRatio,y:(e.clientY-r.top)*devicePixelRatio}}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.strokeStyle=q("#paintColor").value;ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false;q("#paintClear").onclick=()=>{ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height)};q("#paintSave").onclick=()=>{const a=document.createElement("a");a.download="flashos-drawing.png";a.href=c.toDataURL("image/png");a.click()};return}
if(id==="calendar"){const d=new Date(),year=d.getFullYear(),month=d.getMonth();q("#calendarMonth").textContent=d.toLocaleDateString([], {month:"long",year:"numeric"});const grid=q("#calendarGrid");["S","M","T","W","T","F","S"].forEach(x=>grid.insertAdjacentHTML("beforeend",'<div style="text-align:center;color:var(--muted);padding:7px">'+x+'</div>'));for(let i=0;i<new Date(year,month,1).getDay();i++)grid.insertAdjacentHTML("beforeend","<div></div>");for(let day=1;day<=new Date(year,month+1,0).getDate();day++){const today=day===d.getDate();grid.insertAdjacentHTML("beforeend",'<div style="text-align:center;padding:10px 4px;border-radius:9px;background:'+(today?'var(--accent)':'#ffffff08')+';color:'+(today?'#090b12':'var(--text)')+'">'+day+'</div>')}return}
if(id==="settings"){win.querySelectorAll("[data-accent]").forEach(b=>b.onclick=()=>{preferences.accent=b.dataset.accent;safeWrite("flashos.preferences",preferences);renderDesktop();toast("Accent updated")});win.querySelectorAll("[data-wall]").forEach(b=>b.onclick=()=>{preferences.wallpaper=Number(b.dataset.wall);safeWrite("flashos.preferences",preferences);renderDesktop();toast("Wallpaper updated")});q("#resetData").onclick=()=>{if(confirm("Reset notes, decks and virtual files in this browser?")){notes=[{id:Date.now(),title:"Welcome to FlashOS",body:"Start writing here."}];decks=[{name:"My first deck",cards:[]}];files=[];persist();toast("Local app data reset — close and reopen apps")}};return}
if(id==="music"){q("#audioPick").onchange=()=>{const file=q("#audioPick").files[0];if(file){q("#audioPlayer").src=URL.createObjectURL(file);q("#audioPlayer").play().catch(()=>{})}}}
}
$("#taskbar").addEventListener("click",e=>{const b=e.target.closest("[data-app]");if(b)openApp(b.dataset.app)});renderDesktop();updateClock();setInterval(updateClock,15000);$("#bootButton").onclick=startFlashOS;requestAnimationFrame(()=>{$("#bootProgress").style.width="100%"});
</script>
