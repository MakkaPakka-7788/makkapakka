function wireApp(id,win){const q=s=>win.querySelector(s);if(id==="flashaccount"){const status=q("#flashAccountStatus"),signIn=q("#flashAccountSignIn"),signOut=q("#flashAccountSignOut");const paintStatus=user=>{if(user){status.innerHTML="<strong>Signed in</strong><br>"+escapeHTML(user.displayName||"Google user")+"<br><span class=\"muted\">"+escapeHTML(user.email||"")+"</span>";signIn.classList.add("hidden");signOut.classList.remove("hidden")}else{status.textContent="You are signed out.";signIn.classList.remove("hidden");signOut.classList.add("hidden")}};paintStatus(window.flashAccountUser||null);signIn.onclick=async()=>{if(!window.FlashAccount){status.textContent="FlashAccount is still loading. Try again in a moment.";return}signIn.disabled=true;try{await window.FlashAccount.signInWithGoogle()}catch(e){status.textContent="Could not sign in. Check the browser console."}finally{signIn.disabled=false}};signOut.onclick=async()=>{if(!window.FlashAccount)return;signOut.disabled=true;try{await window.FlashAccount.signOut()}catch(e){status.textContent="Could not sign out."}finally{signOut.disabled=false}};window.addEventListener("flashaccount-auth",e=>paintStatus(e.detail));return}if(id==="launcher"){win.querySelectorAll("[data-launch]").forEach(b=>b.onclick=()=>openApp(b.dataset.launch));return}if(id==="notes"){q("#newNote").onclick=()=>{const n={id:Date.now(),title:"New note",body:""};notes.unshift(n);activeNote=n.id;safeWrite("flashos.notes",notes);renderNotes(win)};renderNotes(win);return}if(id==="flashcards"){const refreshSelect=()=>{q("#deckSelect").innerHTML=decks.map((d,i)=>'<option value="'+i+'">'+escapeHTML(d.name)+'</option>').join("");q("#deckSelect").value=String(Math.max(0,Math.min(Number(q("#deckSelect").value)||0,decks.length-1)))};q("#deckSelect").onchange=()=>{flashIndex=0;showAnswer=false;renderFlash(win)};q("#flashCard").onclick=()=>{showAnswer=!showAnswer;renderFlash(win)};q("#flashCard").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();
